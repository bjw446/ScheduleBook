name: Bug Report
description: 버그 발생 시 사용
title: "[BUG] "
labels:
  - bug

body:
  - type: textarea
    id: bug
    attributes:
      label: 버그 내용
      description: 어떤 문제가 발생했는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: 참고사항
      description: 로그, 스크린샷 등을 첨부해주세요.