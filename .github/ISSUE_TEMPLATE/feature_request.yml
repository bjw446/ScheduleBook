name: Feature Request
description: 기능 개발용
title: "[FEATURE] "
labels:
  - feature

body:
  - type: textarea
    id: summary
    attributes:
      label: 기능 설명
      description: 구현할 기능을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: 작업 목록
      description: 세부 작업을 작성해주세요.
      value: |
        - [ ]
        - [ ]
        - [ ]

  - type: textarea
    id: expected
    attributes:
      label: 기대 효과
      description: 해당 기능이 왜 필요한지 작성해주세요.